<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Currículo - Manaus Empregos</title>
    <!-- Importando a biblioteca que transforma HTML em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #0056b3; 
            --text-color: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: var(--text-color); padding: 20px; }
        
        .container-cv { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #218838; }

        /* Estilo do currículo gerado (escondido na tela, usado só pro PDF) */
        #cv-template { display: none; padding: 40px; background: white; color: black; }
        .cv-header { text-align: center; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 20px; }
        .cv-name { font-size: 28px; font-weight: bold; color: var(--primary-color); }
        .cv-section { margin-bottom: 20px; }
        .cv-section h3 { background-color: #f0f2f5; padding: 5px; border-left: 4px solid var(--primary-color); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container-cv">
        <h1>Preencha seu Currículo</h1>
        <p style="text-align: center; margin-bottom: 30px;">Preencha os dados abaixo e baixe seu currículo em PDF pronto para enviar para as vagas!</p>
        
        <div class="form-group">
            <label>Nome Completo:</label>
            <input type="text" id="nome" placeholder="Ex: João da Silva">
        </div>
        <div class="form-group">
            <label>Telefone / WhatsApp:</label>
            <input type="text" id="telefone" placeholder="(92) 90000-0000">
        </div>
        <div class="form-group">
            <label>E-mail:</label>
            <input type="email" id="email" placeholder="seuemail@email.com">
        </div>
        <div class="form-group">
            <label>Resumo Profissional (Opcional):</label>
            <textarea id="resumo" rows="4" placeholder="Fale um pouco sobre seu perfil profissional..."></textarea>
        </div>
        <div class="form-group">
            <label>Experiência Profissional:</label>
            <textarea id="experiencia" rows="4" placeholder="Ex: Empresa X - Cargo (Ano de entrada - Ano de saída)"></textarea>
        </div>
        <div class="form-group">
            <label>Formação Acadêmica:</label>
            <textarea id="formacao" rows="4" placeholder="Ex: Ensino Médio Completo - Escola Y"></textarea>
        </div>

        <button onclick="gerarPDF()">Baixar Currículo em PDF 📄</button>
        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" style="color: var(--primary-color); text-decoration: none;">← Voltar para as vagas</a>
        </div>
    </div>

    <!-- Molde invisível do Currículo que será transformado em PDF -->
    <div id="cv-template">
        <div class="cv-header">
            <div class="cv-name" id="pdf-nome">Nome Completo</div>
            <p><span id="pdf-telefone"></span> | <span id="pdf-email"></span></p>
        </div>
        
        <div class="cv-section">
            <h3>Resumo Profissional</h3>
            <p id="pdf-resumo"></p>
        </div>

        <div class="cv-section">
            <h3>Experiência Profissional</h3>
            <p id="pdf-experiencia" style="white-space: pre-wrap;"></p>
        </div>

        <div class="cv-section">
            <h3>Formação Acadêmica</h3>
            <p id="pdf-formacao" style="white-space: pre-wrap;"></p>
        </div>
    </div>

    <script>
        function gerarPDF() {
            // 1. Pega os valores digitados no formulário
            document.getElementById('pdf-nome').innerText = document.getElementById('nome').value || 'Nome não informado';
            document.getElementById('pdf-telefone').innerText = document.getElementById('telefone').value;
            document.getElementById('pdf-email').innerText = document.getElementById('email').value;
            document.getElementById('pdf-resumo').innerText = document.getElementById('resumo').value;
            document.getElementById('pdf-experiencia').innerText = document.getElementById('experiencia').value;
            document.getElementById('pdf-formacao').innerText = document.getElementById('formacao').value;

            // 2. Mostra o molde do CV rapidamente para a biblioteca conseguir ler
            const elemento = document.getElementById('cv-template');
            elemento.style.display = 'block';

            // 3. Configurações do PDF
            const opcoes = {
                margin:       10,
                filename:     'Meu_Curriculo_ManausEmpregos.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // 4. Gera o PDF e depois esconde o molde novamente
            html2pdf().set(opcoes).from(elemento).save().then(() => {
                elemento.style.display = 'none';
            });
        }
    </script>
</body>
</html>
