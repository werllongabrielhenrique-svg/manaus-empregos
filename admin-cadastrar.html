<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Vaga Direto - Admin</title>
    <style>
        :root { --primary-color: #0056b3; --success-color: #28a745; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding: 20px; }
        .container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .btn { padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none; border: none; font-size: 16px; width: 100%; }
        .btn-success { background-color: var(--success-color); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel Admin: Publicar Vaga Direto</h2>
        <form id="form-publicar-direto" onsubmit="publicarDireto(event)">
            <div class="form-group">
                <label>Título da Vaga / Cargo:</label>
                <input type="text" id="titulo" required placeholder="Ex: Desenvolvedor Front-End Jr">
            </div>
            <div class="form-group">
                <label>Nome da Empresa:</label>
                <input type="text" id="empresa" required placeholder="Ex: Tech Solutions Manaus">
            </div>
            <div class="form-group">
                <label>Localização:</label>
                <input type="text" id="localizacao" value="Manaus, AM" required>
            </div>
            <div class="form-group">
                <label>Salário (Opcional):</label>
                <input type="number" step="0.01" id="salario" placeholder="Ex: 2500.00">
            </div>
            <div class="form-group">
                <label>E-mail de Contato da Vaga:</label>
                <input type="email" id="email_contato" required placeholder="rh@empresa.com">
            </div>
            <div class="form-group">
                <label>Introdução / Resumo da Oportunidade:</label>
                <textarea id="introducao" rows="3" required placeholder="Escreva uma introdução estilo matéria..."></textarea>
            </div>
            <div class="form-group">
                <label>Requisitos (separe os itens com ponto e vírgula `;`):</label>
                <textarea id="requisitos" rows="3" required placeholder="Ensino superior completo; Experiência com React; Inglés básico"></textarea>
            </div>
            <div class="form-group">
    <label>Atividades (separe os itens com ponto e vírgula `;`):</label>
    <textarea id="atividades" rows="3" required placeholder="Desenvolver interfaces; Corrigir bugs; Participar de reuniões"></textarea>
</div>
            <button type="submit" class="btn btn-success">Publicar Vaga no Ar Agora</button>
        </form>
        <br>
        <a href="admin.html" style="display: block; text-align: center; color: #555; text-decoration: none; font-weight: bold;">← Voltar para o Painel</a>
    </div>

    <script>
        async function publicarDireto(event) {
            event.preventDefault();

            const dadosVaga = {
                titulo: document.getElementById('titulo').value,
                empresa: document.getElementById('empresa').value,
                localizacao: document.getElementById('localizacao').value,
                salario: document.getElementById('salario').value ? parseFloat(document.getElementById('salario').value) : null,
                email_contato: document.getElementById('email_contato').value,
                introducao: document.getElementById('introducao').value,
                requisitos: document.getElementById('requisitos').value,
                atividades: document.getElementById('atividades').value
            };

            try {
                const resposta = await fetch('/vagas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosVaga)
                });

                if (resposta.ok) {
                    alert('🚀 Vaga publicada diretamente no ar com sucesso!');
                    window.location.href = 'admin.html';
                } else {
                    alert('Erro ao publicar vaga.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Erro de conexão com o servidor.');
            }
        }
    </script>
</body>
</html>
