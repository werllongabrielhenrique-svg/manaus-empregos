<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Vaga (Formato Editorial) - Manaus Empregos</title>
    <style>
        :root { --primary-color: #0056b3; --text-color: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: var(--text-color); }
        header { background-color: var(--primary-color); color: white; padding: 25px 0; text-align: center; }
        .navbar { background-color: white; border-bottom: 1px solid #e0e0e0; }
        .navbar ul { max-width: 1200px; margin: 0 auto; display: flex; list-style: none; padding: 0 20px; }
        .navbar ul li a { display: block; padding: 15px 20px; color: #555; text-decoration: none; font-weight: 500; }
        .navbar ul li a:hover { color: var(--primary-color); }
        
        .conteudo { max-width: 900px; margin: 30px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: var(--primary-color); margin-bottom: 25px; font-size: 24px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .form-group textarea { resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .submit-btn { background-color: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.3s; }
        .submit-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <header>
        <h1>Manaus Empregos Premium</h1>
        <p>Painel de Publicação Editorial</p>
    </header>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cadastrar-vaga.html" style="color: var(--primary-color); font-weight: bold;">Nova Vaga (Editorial)</a></li>
        </ul>
    </nav>

    <div class="conteudo">
        <h2>Criar Matéria / Vaga no Estilo Portal</h2>
        
        <form id="form-vaga" onsubmit="cadastrarVagaEditorial(event)">
            <div class="form-group">
                <label for="titulo">Título da Matéria / Vaga *</label>
                <input type="text" id="titulo" required placeholder="Ex: Vaga de Analista Administrativo em Manaus: veja requisitos">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="empresa">Nome da Empresa *</label>
                    <input type="text" id="empresa" required placeholder="Ex: Construtora Capital">
                </div>
                <div class="form-group">
                    <label for="localizacao">Localização</label>
                    <input type="text" id="localizacao" value="Manaus, AM">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="salario">Salário (R$) - Opcional</label>
                    <input type="number" step="0.01" id="salario" placeholder="Ex: 2500.00">
                </div>
                <div class="form-group">
                    <label for="email_contato">E-mail para Envio de Currículo *</label>
                    <input type="email" id="email_contato" required placeholder="vagas@empresa.com.br">
                </div>
            </div>

            <div class="form-group">
                <label for="introducao">Introdução / Contexto da Vaga *</label>
                <textarea id="introducao" rows="4" required placeholder="Ex: Uma nova oportunidade está disponível para quem busca o primeiro emprego..."></textarea>
            </div>

            <div class="form-group">
                <label for="requisitos">Requisitos (separados por ponto e vírgula ou tópicos) *</label>
                <textarea id="requisitos" rows="4" required placeholder="Estar cursando o Ensino Médio; Conhecimento básico em Pacote Office; Proatividade."></textarea>
            </div>

            <div class="form-group">
                <label for="atividades">Atividades do Cargo *</label>
                <textarea id="atividades" rows="4" required placeholder="Executar atividades administrativas; Dar suporte nos processos operacionais; Organizar documentos."></textarea>
            </div>

            <button type="submit" class="submit-btn">Publicar Matéria da Vaga</button>
        </form>
    </div>

    <script>
        async function cadastrarVagaEditorial(event) {
            event.preventDefault();

            const dadosVaga = {
                titulo: document.getElementById('titulo').value,
                empresa: document.getElementById('empresa').value,
                localizacao: document.getElementById('localizacao').value,
                salario: document.getElementById('salario').value ? parseFloat(document.getElementById('salario').value) : null,
                email_contato: document.getElementById('email_contato').value,
                introducao: document.getElementById('introducao').value,
                requisitos: document.getElementById('requisitos').value,
                atividades: document.getElementById('atividades').value
            };

            try {
                const resposta = await fetch('http://localhost:3000/solicitar-vaga', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dadosVaga)
});

                const resultado = await resposta.json();

                if (resposta.ok) {
                    alert('📨 Solicitação enviada com sucesso! Nossa equipe analisará os dados e publicará em breve.');
                    window.location.href = 'index.html';
                } else {
                    alert('Erro ao cadastrar: ' + resultado.erro);
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('⚠️ Erro ao conectar com o servidor.');
            }
        }
    </script>
</body>
</html>
